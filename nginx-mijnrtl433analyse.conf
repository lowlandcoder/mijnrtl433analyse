# Nginx-instelling voor mijnrtl433analyse.lab023.nl.
# Plaats dit als /etc/nginx/sites-available/mijnrtl433analyse en activeer met
# een symlink naar sites-enabled. Stel daarna HTTPS in met Certbot.
#
# Deze pagina stuurt door naar de analysecontainer op de sdr-server (poort
# 8300). Afgeschermd via de centrale aanmelding (oauth2-proxy, map mijnlogin).
#
# De sdr-server is 192.168.2.39.
#
# Let op: op de server bouwt Certbot dit bestand om naar een server-blok voor
# poort 443 met certificaatregels, plus een blok voor poort 80 dat alleen
# doorverwijst. De include-regel hoort in het 443-blok.

server {
    listen 80;
    server_name mijnrtl433analyse.lab023.nl;

    # Toegang alleen na inloggen (centrale aanmelding).
    include snippets/lab023-login.conf;

    location / {
        proxy_pass http://192.168.2.39:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Het verversen maakt grafieken; dat mag even duren.
        proxy_read_timeout 120s;
    }
}
